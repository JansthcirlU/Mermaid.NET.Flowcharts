name: Build and Test

on:
  push:
    branches:
      - "main"

  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Check formatter rules
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Build
      run: dotnet build

    - name: Test
      run: dotnet test --no-build --verbosity normal
